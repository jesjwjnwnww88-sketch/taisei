
name: Extra Stage Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: taiseiproject/linux-toolkit:20260804

    env:
      EM_VERSION: "5.0.3"

    steps:
      - name: Checkout Extra Stage branch
        uses: actions/checkout@v7
        with:
          repository: taisei-project/taisei
          ref: yumemi
          submodules: recursive
          fetch-depth: 0
          path: taisei

      - name: Mark source as safe
        run: |
          git config --global --add safe.directory \
            "$GITHUB_WORKSPACE/taisei"

      - name: Install Emscripten
        shell: bash
        run: |
          git clone \
            https://github.com/emscripten-core/emsdk.git \
            "$GITHUB_WORKSPACE/emsdk"

          "$GITHUB_WORKSPACE/emsdk/emsdk" install "$EM_VERSION"
          "$GITHUB_WORKSPACE/emsdk/emsdk" activate "$EM_VERSION"

      - name: Configure, build and install developer version
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/taisei"

          python3 scripts/version.py > .VERSION.tmp
          mv .VERSION.tmp .VERSION

          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"

          cat > misc/ci/emscripten-ephemeral-ci.ini <<EOF
          [constants]
          toolchain = '$GITHUB_WORKSPACE/emsdk/upstream/emscripten/'
          EOF

          meson setup build/ \
            --cross-file misc/ci/common-options.ini \
            --cross-file misc/ci/forcefallback.ini \
            --cross-file misc/ci/emscripten-ephemeral-ci.ini \
            --cross-file misc/ci/emscripten-build.ini \
            --prefix="$GITHUB_WORKSPACE/web-output" \
            --buildtype=debug \
            -Ddeveloper=true \
            -Dwerror=false \
            -Dbuild.cpp_std=gnu++14

          meson compile -C build/ --verbose
          meson install -C build/ --no-rebuild

          echo "Installed HTML files:"
          find "$GITHUB_WORKSPACE/web-output" \
            -type f -name '*.html' -print

          test -n "$(find "$GITHUB_WORKSPACE/web-output" \
            -type f -name '*.html' -print -quit)"

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v7
        with:
          name: taisei-extra-stage-web
          path: web-output/
          if-no-files-found: error
          retention-days: 7

      - name: Prepare GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-output/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish browser build
        id: deployment
        uses: actions/deploy-pages@v4
